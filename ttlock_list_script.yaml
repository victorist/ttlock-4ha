alias: "TTLock — Показать список PIN-кодов"
description: "Получает список PIN-кодов замка и отображает их во всплывающем окне Browser Mod"

fields:
  lock_entity:
    name: "Замок"
    required: true
    selector:
      entity:
        filter:
          - integration: ttlock
            domain: lock

  browser_id:
    name: "Browser ID"
    required: false
    selector:
      text:

sequence:
  # 1. Определение имени замка
  - variables:
      selected_name: >-
        {{ state_attr(lock_entity, 'friendly_name') | default(lock_entity) }}

  # 2. Индикатор загрузки во всплывающем окне
  - if:
      - condition: template
        value_template: "{{ browser_id | default('') | length > 0 }}"
    then:
      - action: browser_mod.popup
        data:
          browser_id: "{{ browser_id }}"
          title: "🔑 Загрузка PIN-кодов..."
          adaptive: true
          content:
            type: markdown
            content: "⏳ Запрашиваем список PIN-кодов для **{{ selected_name }}**..."

  # 3. Запрос списка PIN-кодов из интеграции TTLock
  - action: ttlock.list_passcodes
    continue_on_error: true
    target:
      entity_id: "{{ lock_entity }}"
    response_variable: resp

  # 4. Отображение списка кодов в HTML-таблице
  - if:
      - condition: template
        value_template: "{{ browser_id | default('') | length > 0 }}"
    then:
      - action: browser_mod.popup
        data:
          browser_id: "{{ browser_id }}"
          title: "🔑 PIN-коды: {{ selected_name }}"
          adaptive: true
          content: |
            {% set ns = namespace(passcodes=[]) %}
            {% if resp is defined and resp %}
              {% if resp is mapping %}
                {# Ответ вида {"passcodes": {"lock.b14_116": [...]}} #}
                {% if 'passcodes' in resp %}
                  {% set raw = resp['passcodes'] %}
                  {% if raw is mapping %}
                    {% set target = raw.get(lock_entity) %}
                    {% if target is iterable and not target is string %}
                      {% set ns.passcodes = target %}
                    {% else %}
                      {% for k, v in raw.items() %}
                        {% if v is iterable and not v is string and ns.passcodes | length == 0 %}
                          {% set ns.passcodes = v %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                  {% elif raw is iterable and not raw is string %}
                    {% set ns.passcodes = raw %}
                  {% endif %}
                {# Ответ вида {"lock.b14_116": {"passcodes": [...]}} #}
                {% elif lock_entity in resp %}
                  {% set raw = resp[lock_entity] %}
                  {% if raw is mapping and 'passcodes' in raw and raw['passcodes'] is iterable and not raw['passcodes'] is string %}
                    {% set ns.passcodes = raw['passcodes'] %}
                  {% elif raw is iterable and not raw is string %}
                    {% set ns.passcodes = raw %}
                  {% endif %}
                {# Прямой поиск вложенного списка паролей #}
                {% else %}
                  {% for k, v in resp.items() %}
                    {% if v is mapping and 'passcodes' in v and v['passcodes'] is iterable and not v['passcodes'] is string %}
                      {% set ns.passcodes = v['passcodes'] %}
                    {% elif v is iterable and not v is string and ns.passcodes | length == 0 %}
                      {% set ns.passcodes = v %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% elif resp is iterable and not resp is string %}
                {% set ns.passcodes = resp %}
              {% endif %}
            {% endif %}

            {% if ns.passcodes | length > 0 %}
            <table style="width: 100%; border-collapse: collapse; margin-top: 5px;">
              <thead>
                <tr style="border-bottom: 2px solid #555; text-align: left;">
                  <th style="padding: 6px 4px;">Имя</th>
                  <th style="padding: 6px 4px; text-align: center;">PIN-код</th>
                  <th style="padding: 6px 4px;">Срок действия</th>
                  <th style="padding: 6px 4px; text-align: center;">Статус</th>
                </tr>
              </thead>
              <tbody>
                {% for item in ns.passcodes %}
                {% if item is mapping %}
                  {% set p_name = item.get('name') if item.get('name') else 'Без имени' %}
                  {% set p_code = item.get('passcode') if item.get('passcode') else (item.get('code') if item.get('code') else '—') %}
                  {% set p_type = item.get('type', '') %}
                  {% set p_expired = item.get('expired', false) %}
                  {% set end_val = item.get('end_date', '') | string %}
                {% else %}
                  {% set p_name = 'PIN' %}
                  {% set p_code = item | string %}
                  {% set p_type = '' %}
                  {% set p_expired = false %}
                  {% set end_val = '' %}
                {% endif %}

                {% if p_type == 'permanent' or end_val.startswith('1970') or not end_val or end_val == 'None' %}
                  {% set end_str = 'Постоянный' %}
                {% else %}
                  {% set end_str = as_timestamp(end_val) | timestamp_custom('%d.%m.%Y %H:%M', default=end_val) %}
                {% endif %}
                {% set status = '🔴 Истёк' if p_expired else '🟢 Активен' %}
                <tr style="border-bottom: 1px solid #333;">
                  <td style="padding: 6px 4px;"><b>{{ p_name }}</b></td>
                  <td style="padding: 6px 4px; text-align: center;"><code>{{ p_code }}</code></td>
                  <td style="padding: 6px 4px;">{{ end_str }}</td>
                  <td style="padding: 6px 4px; text-align: center;">{{ status }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            {% else %}
            <p>⚠️ <b>PIN-коды не найдены</b> или замок находится офлайн.</p>
            {% endif %}

            <details style="margin-top: 15px; color: #888;">
              <summary style="cursor: pointer; font-size: 0.85em;">🔍 Отладка ответа API (JSON)</summary>
              <pre style="font-size: 0.75em; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto; background: #111; padding: 6px; border-radius: 4px;">{{ resp | to_json if resp is defined else 'Ответ не получен' }}</pre>
            </details>
