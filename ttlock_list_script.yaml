alias: "TTLock — Показать список PIN-кодов"
description: "Получает список PIN-кодов замка и отображает их во всплывающем окне Browser Mod"

fields:
  lock_entity:
    name: "Замок"
    required: true
    selector:
      entity:
        filter:
          - integration: ttlock
            domain: lock

  browser_id:
    name: "Browser ID"
    required: false
    selector:
      text:

sequence:
  # 1. Определение имени замка
  - variables:
      selected_name: >-
        {{ state_attr(lock_entity, 'friendly_name') | default(lock_entity) }}

  # 2. Индикатор загрузки во всплывающем окне
  - if:
      - condition: template
        value_template: "{{ browser_id | default('') | length > 0 }}"
    then:
      - action: browser_mod.popup
        data:
          browser_id: "{{ browser_id }}"
          title: "🔑 Загрузка PIN-кодов..."
          adaptive: true
          content:
            type: markdown
            content: "⏳ Запрашиваем список PIN-кодов для **{{ selected_name }}**..."

  # 3. Запрос списка PIN-кодов из интеграции TTLock
  - action: ttlock.list_passcodes
    continue_on_error: true
    target:
      entity_id: "{{ lock_entity }}"
    response_variable: resp

  # 4. Отображение красивой таблицы во всплывающем окне (обязательно с | для сохранения переносов строк \n)
  - if:
      - condition: template
        value_template: "{{ browser_id | default('') | length > 0 }}"
    then:
      - action: browser_mod.popup
        data:
          browser_id: "{{ browser_id }}"
          title: "🔑 PIN-коды: {{ selected_name }}"
          adaptive: true
          content: |
            {% set items = [] %}
            {% if resp is defined and resp %}
              {% if resp is mapping %}
                {% if 'passcodes' in resp %}
                  {% set items = resp['passcodes'] %}
                {% else %}
                  {% set entity_data = resp.get(lock_entity, {}) %}
                  {% set items = entity_data.get('passcodes', []) if entity_data is mapping else [] %}
                {% endif %}
              {% elif resp is iterable and not resp is string %}
                {% set items = resp %}
              {% endif %}
            {% endif %}

            {% if items | length > 0 %}
            | Имя | PIN-код | Срок действия | Статус |
            | :--- | :---: | :---: | :---: |
            {% for item in items %}
            {% set p_name = item.name | default('Без имени') %}
            {% set p_code = item.passcode | default(item.code | default('—')) %}
            {% set p_type = item.type | default('') %}
            {% set p_expired = item.expired | default(false) %}
            {% set end_val = item.end_date | default('') | string %}
            {% if p_type == 'permanent' or end_val.startswith('1970') or not end_val %}
              {% set end_str = 'Постоянный' %}
            {% else %}
              {% set end_str = as_timestamp(end_val) | timestamp_custom('%d.%m.%Y %H:%M', default=end_val) %}
            {% endif %}
            {% set status = '🔴 Истёк' if p_expired else '🟢 Активен' %}
            | **{{ p_name }}** | `{{ p_code }}` | {{ end_str }} | {{ status }} |
            {% endfor %}
            {% else %}
            ⚠️ **PIN-коды не найдены** или замок находится офлайн.
            {% endif %}
